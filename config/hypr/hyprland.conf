# wiki thingy
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/theme.conf


#█▀▄▀█ █▀█ █▄░█ █ ▀█▀ █▀█ █▀█ █▀
#█░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄ ▄█
monitor=eDP-1,2560x1600@165.0Hz,0x0,1.25
monitor=desc:ASUSTek COMPUTER INC VG28UQL1A 0x01010101,2560x1440@120hz, 2048x0,1
monitor=desc:ASUSTek COMPUTER INC ASUS VG289Q1A R6LMTF137103,2560x1440@59.95hz, 4608x0,1

workspace = 2, monitor:eDP-1, default:true
workspace = 1, monitor:desc:ASUSTek COMPUTER INC VG28UQL1A 0x01010101, default:true
workspace = 3, monitor:desc:ASUSTek COMPUTER INC ASUS VG289Q1A R6LMTF137103, default:true

# startup programs
exec-once = awww-daemon # background manager
exec-once = waybar # bar at the top, mod+b toggles it
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 # authentication agent
exec-once = hypridle # dealing with sleep, locking, etc
exec-once = hyprsunset # screen shade filter, button is on waybar or mod+n
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user start hyprland-session.target #idk something with themeing i dont know why it works

# environment variables https://wiki.hyprland.org/Configuring/Environment-variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_MENU_PREFIX,arch- # meant to fix "open with" in dolphin showing no apps, but it doesnt work
env = QT_QPA_PLATFORMTHEME, kde # makes dolphin actually themable, theres probably a better way tho

#█ █▄░█ █▀█ █░█ ▀█▀ █▀
#█ █░▀█ █▀▀ █▄█ ░█░ ▄█

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us

    follow_mouse = 1

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
        disable_while_typing = true
    }
}
