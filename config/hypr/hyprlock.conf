# SETTINGS
# for the custom.conf script overwriting idk
$date_font_size = 50
$time_font_size = 200
$custom_text = hai :3
$custom_text_size = 25
$battery_command = cmd[update:1000] echo "󰂎 $(cat /sys/class/power_supply/BAT1/capacity)%"
$battery_font_size = 24

source = ~/.config/hypr/hyprlock_custom.conf

# BACKGROUND
background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = false   
}

# maybe just maybe one day fprintd will stop crashing on suspend
# auth {
#     fingerprint:enabled = true
# }

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(17, 17, 27, 0.2)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    rounding = -1
    check_color = rgb(137, 180, 250)
    placeholder_text = <i><span foreground="##cdd6f4">Input Password...</span></i>
    hide_input = false
    position = 0, -25%
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgb(205, 214, 244)
  font_size = $date_font_size
  font_family = CaskaydiaMonoNerdFont
  position = 0, 30%
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = rgb(245, 194, 231)
  font_size = $time_font_size
  font_family = JetBrains Mono Extrabold
  position = 0, 15%
  halign = center
  valign = center
}

# custom
label {
    monitor =
    text = $custom_text
    color = rgb(205, 214, 244)
    font_size = $custom_text_size
    font_family = CaskaydiaMonoNerdFont
    position = 0, 0
    halign = center
    valign = center
}

# battery
label {
    monitor =
    text = $battery_command
    color = rgb(205, 214, 244)
    font_size = $battery_font_size
    font_family = CaskaydiaMonoNerdFont
    position = -30, -10
    halign = right
    valign = top
}
